name: build-windows-oneclick

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-windows-oneclick:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build one-click package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $LogPath = "build-oneclick.log"
          if (Test-Path $LogPath) { Remove-Item $LogPath -Force }
          New-Item -ItemType File -Path $LogPath -Force | Out-Null
          try {
            .\win\build_windows_oneclick.ps1 2>&1 | Tee-Object -FilePath $LogPath -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Build command exited with code $LASTEXITCODE"
            }
          } catch {
            $err = $_ | Out-String
            $errEscaped = $err.Replace("%", "%%").Replace("`r", "").Replace("`n", "%0A")
            Write-Host "::error ::$errEscaped"
            $err | Tee-Object -FilePath $LogPath -Append
            throw
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-oneclick-log
          path: build-oneclick.log
          if-no-files-found: warn

      - name: Attach build log to summary
        if: always() && hashFiles('build-oneclick.log') != ''
        shell: pwsh
        run: |
          "## 一键打包执行日志（前 100 行）" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "```text" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content build-oneclick.log | Select-Object -First 100 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "```" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slurry-rate-calculator-windows-oneclick
          path: dist\slurry-rate-calculator-windows-oneclick.zip
          if-no-files-found: error
