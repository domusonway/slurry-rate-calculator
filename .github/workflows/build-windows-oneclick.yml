name: build-windows-oneclick

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-windows-oneclick:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build one-click package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          .\win\build_windows_oneclick.ps1 2>&1 | Tee-Object -FilePath dist\build-oneclick.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-oneclick-log
          path: dist\build-oneclick.log
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slurry-rate-calculator-windows-oneclick
          path: dist\slurry-rate-calculator-windows-oneclick.zip
          if-no-files-found: error
